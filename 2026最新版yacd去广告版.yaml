# ==========================================
# 4. 分流规则（严密排序，确保前置截流）
# ==========================================
rules:
  # ==========================================================
  # ★ 核心 1：底层协议拦截与防断流（本地最高优先级，先命中先执行）
  # ==========================================================
  # 淘宝/天猫 UDP 443 强切 TCP（解决手机端刷商品、查看图片转圈与断流）
  - AND,((DOMAIN-KEYWORD,taobao),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - AND,((DOMAIN-KEYWORD,alicdn),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - AND,((DOMAIN-KEYWORD,tmall),(DST-PORT,443),(NETWORK,UDP)),REJECT
  # 京东后台调试日志上报拦截（减少无用后台请求）
  - DOMAIN-SUFFIX,jddebug.com,REJECT
  # 苹果 Spotlight 本地搜索分析与隐私上报拦截（提升搜索响应速度）
  - DOMAIN-SUFFIX,smoot.apple.com,REJECT

  # ==========================================================
  # ★ 核心 2：系统长连接与 Wi-Fi Calling 核心端口（纯端口规则必须留本地）
  # ==========================================================
  # 苹果 APNs 消息推送 5223 端口直连（确保锁屏秒推通知、省电）
  - DST-PORT,5223,🎯 全球直连
  # 苹果机房原生 IP 段直连兜底（no-resolve 免二次 DNS 查询拖慢连接）
  - IP-CIDR,17.0.0.0/8,🎯 全球直连,no-resolve
  # 美国手机卡 Wi-Fi Calling IPsec 密钥交换与数据隧道（本地直连通道）
  - DST-PORT,500,🎯 全球直连
  - DST-PORT,4500,🎯 全球直连

  # ==========================================================
  # ★ 核心 3：零星特殊长连接与中继直达
  # ==========================================================
  # Windows 系统通知与推送通道（低延迟香港测速组，解决频繁掉线重试）
  - DOMAIN-SUFFIX,wns.windows.com,⚡ 香港自动
  # GitHub 加速镜像域名（拉回代理优选组，防止第三方规则误入直连撞墙）
  - DOMAIN-SUFFIX,ghfast.top,♻️ 自动选择
  # Apple 智能与私密转送（香港地区不可用，统一调度到南洋节点）
  - DOMAIN-SUFFIX,apple-relay.apple.com,🌏 南洋节点
  - DOMAIN-SUFFIX,apple-relay.cloudflare.com,🌏 南洋节点
  - DOMAIN-KEYWORD,apple-intelligence,🌏 南洋节点

  # ==========================================================
  # ★ 核心 4：挂载 11 个 GitHub 外部规则集（精准调度至你原有的策略组）
  # ==========================================================
  # 1. 全球直连白名单（国内通道、微软系统更新、Steam下载CDN、Wi-Fi Calling鉴权、贝宝中国）
  - RULE-SET,DIRECT,🎯 全球直连
  # 2. 纯美区专属业务（Google Voice、海外卡官网、Copilot认证与Bing网关）
  - RULE-SET,US-ONLY,🇺🇸 美国节点
  # 3. 菲律宾金融专线（GCash与Mynt官方API，防止异地风控封号）
  - RULE-SET,BANK-PH,🇵🇭 菲律宾节点
  # 4. 国际金融与电子钱包（PayPal国际版、Wise全链路）
  - RULE-SET,FINANCE-GLOBAL,🏦 金融银行
  # 5. 虾皮电商全家桶（官方与各站点卖家后台）
  - RULE-SET,SHOPEE,🟠 虾皮电商
  # 6. 亚马逊运营中心（卖家中心与后台静态资源）
  - RULE-SET,AMAZON,📦 Amazon
