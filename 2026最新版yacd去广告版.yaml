port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: ''

# ==========================================
# 1. 机场官方专线 DNS（完全原样保留）
# ==========================================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 114.114.114.114
    - 119.29.29.29
  nameserver-policy:
    # ★ 广告域名直接拒绝解析（抢在 cn 直连前面拦截，避免返回真实 IP）
    "geosite:category-ads-all": rcode://refused

    # 1. 机场官方专线解析（保持不动）


    # 2. 苹果生态直连（保持不动）
    "geosite:apple": 223.5.5.5
    "*.apple.com": 223.5.5.5
    "*.icloud.com": 223.5.5.5
    "*.itunes.apple.com": 223.5.5.5
    "*.ls.apple.com": 223.5.5.5
    "*.push.apple.com": 223.5.5.5

    # 3. 大陆合规网站走国内 DNS（保持不动）
    "geosite:cn": 223.5.5.5

    # 4. 海外外网走加密通道（彻底杜绝明文 8.8.8.8 撞墙丢包）
    #"geosite:geolocation-!cn": 8.8.8.8
  fallback:
    - 8.8.8.8
    - 1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ==========================================
# 2. 机场节点代理集（完全原样保留）
# ==========================================
proxy-providers:
  Provider_53B372:
    type: http
    url: "填上你的机场"
    interval: 3600
    path: "./proxy_provider/Provider_53B372.yaml"
    health-check:
      enable: true
      url: http://cp.cloudflare.com
      interval: 300

